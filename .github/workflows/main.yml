

name: Build Sri Lanka NIC Checker APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          unzip -q "$ZIP" -d extracted
          ROOT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SriLankaNICChecker-V2-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
